trend_research:
  description: >
    Search Reddit, HackerNews, and the web for the most active conversations
    happening RIGHT NOW in the {niche} space. Use all available tools.
    Return a structured list of exactly 10 trends, each with:
    - The trend title or topic
    - Where it was found (platform, subreddit, etc.)
    - Engagement signal (upvotes, comments, points)
    - A one-sentence summary of why this is trending
  expected_output: >
    A numbered list of 10 trends with source, engagement signal, and a brief
    explanation of what is driving the conversation.
  agent: trend_hunter

audience_analysis:
  description: >
    Take the 10 trends from the previous task and analyse the emotional landscape.
    For each trend, identify: the primary emotion driving it (fear, desire, FOMO,
    frustration, pride, curiosity), the audience segment most invested in it,
    and a single insight sentence that could become the core of a viral post.
  expected_output: >
    A structured breakdown for each trend: emotion type, audience segment,
    and a one-sentence content insight.
  agent: audience_psychologist

content_strategy:
  description: >
    Using the trends and emotional insights, create {angles} content angles for
    the platforms {platforms}. Each angle must be clearly distinct. For each angle provide:
    - The angle name (a short label)
    - The emotional hook it targets
    - Which platform it is best suited for and why
    - A sample opening line (not the final copy, just a direction)
  expected_output: >
    {angles} clearly differentiated content angles with platform recommendations
    and sample opening directions.
  agent: content_strategist

copywriting:
  description: >
    For each content angle, write {variations} post variations per platform in {platforms}.
    Requirements per piece:
    - A strong hook (first 1-2 lines that stop the scroll)
    - A body that delivers value or a story
    - A clear call to action at the end
    - 3 to 5 relevant hashtags (without the # symbol)
    - Stay within character limits: Twitter 280, LinkedIn 3000, Instagram 2200

    Return a JSON object with a "pieces" array. Each piece has these exact fields:
    platform (string), angle (string), hook (string), body (string), hashtags (list of strings without #).
  expected_output: >
    A valid JSON object with a "pieces" array containing all content pieces,
    each with platform, angle, hook, body, and hashtags fields.
  agent: copywriter

creative_review:
  description: >
    Review every content piece written. For each one:
    - Rate the hook strength (weak / decent / strong)
    - Rewrite any weak hooks
    - Confirm the body delivers on the hook's promise
    - Add a format suggestion (e.g. "thread", "carousel", "single stat image", "text only")
    - Flag any that sound too corporate or AI-generated and rewrite them
  expected_output: >
    The full revised content list with hook ratings, any rewrites applied,
    and a format suggestion for each piece.
  agent: creative_director

scoring:
  description: >
    Score every content piece from the copywriting task. Use your editorial judgement —
    you do not need any tools to score. Optionally query past performance for context.

    Score each piece on this rubric (total 100 points):
    - scroll_stop: max 30 (how strong is the first line?)
    - emotional_resonance: max 25 (does it connect emotionally?)
    - platform_fit: max 20 (does the tone match the platform?)
    - clarity: max 15 (is the message immediately clear?)
    - originality: max 10 (does it feel fresh, not generic?)

    The total score = sum of all five dimensions.
    Mark the top 10 highest-scoring pieces as recommended = true.

    Return a JSON object with a "pieces" array. Each piece must include all original
    fields (platform, angle, hook, body, hashtags) plus: score, scroll_stop,
    emotional_resonance, platform_fit, clarity, originality, recommended.
  expected_output: >
    A valid JSON object with a "pieces" array where every piece includes the original
    content fields plus score breakdown and recommended flag.
  agent: performance_analyst
